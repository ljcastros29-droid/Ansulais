name: Publicar prototipo en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/webpage-prototype-layout-x71q68

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
